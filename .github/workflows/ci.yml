name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kalkylinsiktsportalen.sln

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set +e
          dotnet build src/Kalkylinsiktsportalen.sln --configuration Release --no-restore -clp:ErrorsOnly > build.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          cat build.log
          exit 1

      - name: Test
        if: steps.build.outputs.exit_code == '0'
        run: dotnet test src/Kalkylinsiktsportalen.sln --configuration Release --no-build
