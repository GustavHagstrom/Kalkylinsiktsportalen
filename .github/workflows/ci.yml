name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kalkylinsiktsportalen.sln

      - name: Build
        run: dotnet build src/Kalkylinsiktsportalen.sln --configuration Release --no-restore -clp:ErrorsOnly

      - name: Test
        run: dotnet test src/Kalkylinsiktsportalen.sln --configuration Release --no-build
